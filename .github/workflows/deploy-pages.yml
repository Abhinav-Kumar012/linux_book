name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          curl -sL https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-linux-amd64.tar.gz | sudo tar xz --strip-components=1 -C /usr/local
          pandoc --version | head -1

      - name: Build HTML
        run: |
          set -euo pipefail

          OUTDIR="build/html"
          mkdir -p "$OUTDIR/css" "$OUTDIR/js"

          # ── Combine all markdown in correct order ──
          echo "Combining chapters..."
          : > build/combined.md
          for part_dir in \
            part1-history part2-installation part3-shell part4-commands \
            part5-filesystems part6-process part7-memory part8-kernel \
            part9-syscalls part10-networking part11-security part12-containers \
            part13-ebpf part14-drivers part15-boot part16-elf \
            part17-debugging part18-performance part19-source-walkthrough \
            part20-programming appendices; do
            if [ -d "$part_dir" ]; then
              for f in "$part_dir"/*.md; do
                [ -f "$f" ] && cat "$f" && printf '\n\n\\newpage\n\n'
              done
            fi
          done >> build/combined.md

          echo "Files combined: $(wc -w < build/combined.md) words"

          # ── Pandoc → HTML ──
          echo "Running pandoc..."
          pandoc build/combined.md \
            --from markdown \
            --to html5 \
            --standalone \
            --toc \
            --toc-depth=2 \
            --highlight-style=tango \
            --css css/style.css \
            --include-in-header=<(echo '<meta name="viewport" content="width=device-width, initial-scale=1.0">') \
            --metadata title="The Comprehensive Linux Handbook" \
            --output "$OUTDIR/index.html"

          # ── Inline CSS (so it works without server) ──
          cat > "$OUTDIR/css/style.css" << 'CSSEOF'
          :root { --bg:#fdfdfd; --fg:#1a1a1a; --accent:#d63384; --link:#0969da; --code-bg:#f6f8fa; --border:#d0d7de; }
          @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#c9d1d9;--accent:#f778ba;--link:#58a6ff;--code-bg:#161b22;--border:#30363d;}}
          *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
          body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.7;color:var(--fg);background:var(--bg);max-width:52rem;margin:0 auto;padding:2rem 3rem}
          h1{font-size:2rem;font-weight:800;margin:2rem 0 1rem;border-bottom:2px solid var(--accent);padding-bottom:.3rem}
          h2{font-size:1.5rem;font-weight:700;margin:2.5rem 0 .75rem;color:var(--accent)}
          h3{font-size:1.2rem;font-weight:600;margin:2rem 0 .5rem}
          code{font-family:"SFMono-Regular",Consolas,monospace;font-size:.875em;background:var(--code-bg);padding:.15em .4em;border-radius:4px}
          pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;overflow-x:auto;margin-bottom:1.5rem;font-size:.85rem;line-height:1.6}
          pre code{background:none;padding:0;border-radius:0;font-size:inherit}
          table{width:100%;border-collapse:collapse;margin-bottom:1.5rem;font-size:.9rem}
          th,td{padding:.5rem .75rem;border:1px solid var(--border);text-align:left}
          th{background:var(--code-bg);font-weight:600}
          ul,ol{margin:0 0 1rem 1.5rem}
          li{margin-bottom:.25rem}
          blockquote{border-left:4px solid var(--accent);padding:.5rem 1rem;margin:0 0 1rem;background:var(--code-bg);border-radius:0 6px 6px 0}
          a{color:var(--link);text-decoration:none}
          CSSEOF

          echo "Done. Output:"
          ls -lh "$OUTDIR/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4