site_name: The Comprehensive Linux Handbook
site_description: From Beginner to Kernel Developer
site_url: https://abhinav-kumar012.github.io/linux_book/

theme:
  name: material

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - pymdownx.emoji

plugins:
  - search